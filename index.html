<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>爱记笔记</title>
  <meta name="description" content="爱记笔记 · 优雅的中文笔记 App，支持自定义标签与分享卡片">
  <meta name="apple-itunes-app" content="app-id=6767819417">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 90% 10%, rgba(199, 87, 40, 0.14), transparent 28rem),
        linear-gradient(180deg, #fbf6ea, #f8f1e4);
      color: #23201c;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    main {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0;
      text-align: center;
    }
    h1 {
      font-size: clamp(40px, 8vw, 64px);
      margin: 0 0 16px;
      letter-spacing: 0.02em;
    }
    .tagline {
      color: #686054;
      font-size: 18px;
      margin: 0 0 36px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 44px;
    }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
    a.btn.primary {
      background: #c75728;
      color: #fffdf8;
    }
    a.btn.secondary {
      background: rgba(199, 87, 40, 0.12);
      color: #c75728;
    }
    .features {
      text-align: left;
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid #e1d5c4;
      border-radius: 18px;
      padding: clamp(20px, 4vw, 36px);
    }
    .features h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }
    .features ul {
      margin: 0;
      padding-left: 1.3em;
      color: #4a423a;
    }
    .features li {
      margin: 6px 0;
    }
    footer {
      color: #8e8779;
      font-size: 13px;
      margin-top: 32px;
      text-align: center;
    }
    footer a { color: #686054; }
  </style>
</head>
<body>
  <main>
    <h1>爱记笔记</h1>
    <p class="tagline">把想法写下来，做成一张漂亮的卡片，分享给自己和朋友。</p>

    <div class="actions">
      <a class="btn primary" href="dl.html">下载（App Store）</a>
      <a class="btn secondary" href="support.html">技术支持</a>
    </div>

    <section class="features">
      <h2>它是什么</h2>
      <ul>
        <li>一个**只做手写笔记**的 iOS app，不打扰、不催促。</li>
        <li>标题可写可不写。给笔记加自己的标签，按标签随时筛选。</li>
        <li>14 套精致的分享卡片模板（米色书页、电影海报、夜空星图、暖灯夜读……），把笔记变成可发朋友圈的图。</li>
        <li>本地优先，不需要注册账号，数据只存在你的手机上。</li>
        <li>使用 LXGW 文楷字体，正文阅读体验向严肃书籍看齐。</li>
      </ul>
    </section>

    <footer>
      © 爱记笔记 · <a href="privacy.html">隐私政策</a> · <a href="support.html">技术支持</a>
    </footer>
  </main>
</body>
</html>
